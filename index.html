<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Pomodoro Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #282828; /* Dark grey like image */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            flex-direction: column;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            padding-top: 80px; /* Make space for top bar */
            padding-bottom: 100px; /* Make space for bottom controls */
        }

        /* --- Top Bar --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            z-index: 100;
        }

        .time-display {
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .top-icons {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* --- Timer Wheel --- */
        .timer-wheel-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .timer-wheel {
            position: relative;
            width: 350px;
            height: 350px;
            margin: 20px auto;
        }

        .wheel-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Colors from image */
            background: conic-gradient(
                #9B51E0 0deg 90deg,  /* 0-15 min (Top-Right) */
                #56CCF2 90deg 180deg, /* 15-30 min (Bottom-Right) */
                #6FCF97 180deg 270deg, /* 30-45 min (Bottom-Left) */
                #F2C94C 270deg 315deg, /* 45-52.5 min (Yellow) */
                #E65C4F 315deg 360deg  /* 52.5-60 min (Red/Orange) */
            );
            transform: rotate(-90deg); /* Puts 0deg (start of purple) at the top */
        }

        .wheel-ticks {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background: rgba(255, 255, 255, 0.7);
        }
        .tick.large {
            width: 4px;
            height: 18px;
            background: #fff;
        }

        .wheel-numbers {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .number {
            position: absolute;
            font-size: 22px;
            font-weight: 500;
            color: #fff;
            transform: translate(-50%, -50%);
        }

        .wheel-pointer {
            position: absolute;
            width: 24px;
            height: 140px; /* 40% of wheel height */
            background: #fff;
            border-radius: 12px 12px 0 0;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            transform: translateX(-50%) rotate(0deg); /* Starts at top */
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .wheel-center {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #282828;
            border: 4px solid #fff;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
        }

        /* --- Bottom Controls --- */
        .controls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px 30px;
            align-items: center;
            z-index: 100;
        }

        .control-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .control-btn:hover {
            color: #fff;
        }
        .control-btn.play {
            font-size: 50px;
            color: #fff;
        }
        .control-btn.play:hover {
            transform: scale(1.1);
        }

        /* Play/Pause icons */
        .play-icon::before { content: '▶'; }
        .pause-icon::before { content: '⏸'; }

        /* --- Sync Indicator --- */
        .sync-indicator {
            position: fixed;
            top: 28px;
            right: 170px; /* Position next to icons */
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 100;
        }
        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .sync-dot.syncing { background: #FFC107; }
        .sync-dot.offline { background: #F44336; animation: none; }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-title {
            font-size: 24px;
            font-weight: 500;
        }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
        }
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .settings-section {
            margin-bottom: 30px;
        }
        .settings-label {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 12px;
            display: block;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Sound options */
        .sound-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }
        .sound-option {
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .sound-option:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .sound-option.selected {
            background: rgba(255, 107, 90, 0.2);
            border-color: #ff6b5a;
        }
        .sound-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        .sound-name {
            font-size: 13px;
        }

        /* New Sync ID Input */
        .id-input {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            font-family: monospace;
            margin-bottom: 10px;
        }
        .id-buttons {
            display: flex;
            gap: 10px;
        }

        .user-id-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 12px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            margin-top: 15px;
        }

        .copy-btn {
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 12px;
            flex-grow: 1;
        }
        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Dropdown - from old code, moved to modal */
        .timer-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }
        .timer-select option {
            background: #1a1a1a;
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .time-display {
                font-size: 28px;
            }
            .timer-wheel {
                width: 280px;
                height: 280px;
            }
            .wheel-pointer {
                width: 20px;
                height: 112px; /* 40% */
                border-radius: 10px 10px 0 0;
            }
            .wheel-center {
                width: 16px;
                height: 16px;
                border-width: 3px;
            }
            .number {
                font-size: 18px;
            }
            .sync-indicator {
                display: none; /* Hide on small screens */
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="top-icons">
            <div class="sync-indicator">
                <div class="sync-dot" id="syncDot"></div>
                <span id="syncStatus">Synced</span>
            </div>
            <button class="icon-btn" title="Toggle Bell (not implemented)">🔔</button>
            <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
        </div>
    </div>

    <div class="container">

        <div class="timer-wheel-container">
            <div class="timer-wheel">
                <div class="wheel-bg"></div>
                <div class="wheel-ticks" id="wheelTicks"></div>
                <div class="wheel-numbers" id="wheelNumbers"></div>
                <div class="wheel-pointer" id="wheelPointer"></div>
                <div class="wheel-center"></div>
            </div>
        </div>

        <div></div>

    </div>

    <div class="controls">
        <button class="control-btn" id="prevBtn" title="Back 1 min">⏪</button>
        <button class="control-btn play" id="playPauseBtn" title="Play/Pause">
            <span class="play-icon"></span>
        </button>
        <button class="control-btn" id="nextBtn" title="Forward 1 min">⏩</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Settings</h2>
                <button class="close-btn" id="closeModal">×</button>
            </div>

            <div class="settings-section">
                <label class="settings-label" for="timerSelect">Duration</label>
                <select class="timer-select" id="timerSelect">
                    <option value="5">5 minutes</option>
                    <option value="10">10 minutes</option>
                    <option value="15">15 minutes</option>
                    <option value="25" selected>25 minutes</option>
                    <option value="30">30 minutes</option>
                    <option value="45">45 minutes</option>
                    <option value="60">60 minutes</option>
                </select>
            </div>

            <div class="settings-section">
                <label class="settings-label">Alert Sound</label>
                <div class="sound-options" id="soundOptions"></div>
                <button class="copy-btn" id="testSoundBtn" style="width: 100%; margin-top: 10px;">Test Sound</button>
            </div>

            <div class="settings-section">
                <label class="settings-label">Sync ID</label>
                <p style="font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 10px;">
                    Enter an ID to sync. Use the same ID on other devices.
                </p>
                <input type="text" class="id-input" id="userIdInput" placeholder="Enter sync ID...">
                <div class="id-buttons">
                    <button class="copy-btn" id="syncIdBtn">Sync to this ID</button>
                    <button class="copy-btn" id="copyIdBtn">Copy Current ID</button>
                </div>
                <div class="user-id-box">
                    <strong>Current ID:</strong> <span id="userIdDisplay">Loading...</span>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="timer.js"></script>
</body>
</html>
