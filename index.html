<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <style>
        :root {
            --bg-color: #262626;
            --text-color: #e0e0e0;
            --icon-color: #666666;
            --icon-hover: #aaaaaa;
            --tick-color: rgba(255, 255, 255, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Top Bar --- */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            z-index: 100;
        }

        .app-title {
            font-size: 15px;
            font-weight: 600;
            color: #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            letter-spacing: 0.5px;
        }
        .time-text { font-variant-numeric: tabular-nums; }
        .task-name { color: #999; font-weight: 400; }

        .settings-container {
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
        }

        .svg-icon {
            width: 18px;
            height: 18px;
            fill: var(--icon-color);
            cursor: pointer;
            transition: fill 0.2s ease, transform 0.5s ease;
        }
        .svg-icon:hover {
            fill: var(--icon-hover);
            transform: rotate(90deg);
        }

        /* --- Timer Wheel --- */
        .timer-container {
            position: relative;
            width: 360px;
            height: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            margin-top: 10px;
        }

        .timer-container:active { cursor: grabbing; }
        body.is-running .timer-container { cursor: default; }

        .dial-colors {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #9059FF 0deg 120deg,    /* Purple */
                #0088FF 120deg 210deg,  /* Blue */
                #50C8C6 210deg 270deg,  /* Teal */
                #FFCD00 270deg 300deg,  /* Yellow */
                #FF9F00 300deg 330deg,  /* Orange */
                #FF4C4C 330deg 360deg   /* Red */
            );
        }

        .dial-mask {
            position: absolute;
            width: 100.5%;
            height: 100.5%;
            border-radius: 50%;
            background: conic-gradient(
                transparent 0deg,
                transparent var(--angle, 0deg),
                var(--bg-color) var(--angle, 0deg),
                var(--bg-color) 360deg
            );
            z-index: 2;
        }

        .dial-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
        }

        .tick {
            position: absolute;
            background: var(--tick-color);
            width: 2px;
            height: 12px;
            left: 50%;
            top: 0;
            transform-origin: 50% 180px;
        }
        .tick.major {
            background: rgba(255, 255, 255, 0.5);
            width: 3px;
            height: 20px;
        }

        .number {
            position: absolute;
            font-size: 18px;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
            transform: translate(-50%, -50%);
            width: 40px;
            text-align: center;
        }

        .pointer-container {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
            transform: rotate(var(--angle, 0deg));
            transition: transform 0.1s linear;
            pointer-events: none;
        }

        .pointer-arm {
            position: absolute;
            left: calc(50% - 7px);
            bottom: 50%;
            width: 14px;
            height: 165px;
            background: #fff;
            border-radius: 8px 8px 0 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transform-origin: bottom center;
        }

        .drag-knob {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            background: linear-gradient(to bottom, #ffffff, #dddddd);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            z-index: 11;
            pointer-events: auto;
            cursor: grab;
            transition: opacity 0.3s ease, transform 0.2s;
        }
        .drag-knob:hover { transform: translateX(-50%) scale(1.1); }
        .drag-knob:active { cursor: grabbing; }

        body.is-running .drag-knob {
            opacity: 0;
            pointer-events: none;
        }

        .center-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--bg-color);
            border: 3px solid #fff;
            border-radius: 50%;
            z-index: 12;
        }

        /* --- Bottom Controls --- */
        .controls {
            position: fixed;
            bottom: 60px;
            display: flex;
            align-items: center;
            gap: 50px;
            z-index: 100;
        }

        .control-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.2s;
        }
        .control-icon { fill: #888; transition: fill 0.2s; }
        .control-btn:hover { opacity: 1; }
        .control-btn:hover .control-icon { fill: #fff; }
        .control-btn.play .control-icon { width: 28px; height: 28px; fill: #bbb; }
        .control-btn.play:hover .control-icon { fill: #fff; }

        /* --- Modal --- */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #333;
            padding: 25px;
            border-radius: 12px;
            width: 300px;
            text-align: center;
            border: 1px solid #444;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-box h3 { color: #fff; margin-bottom: 15px; font-weight: 500; font-size: 18px;}
        .modal-box input {
            width: 100%; padding: 10px; margin: 10px 0 20px 0;
            background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 14px;
        }
        .modal-box input:focus { outline: none; border-color: #666; }

        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 8px 16px; background: #444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        .modal-btn:hover { background: #555; }
        .modal-btn.primary { background: #0088FF; }
        .modal-btn.primary:hover { background: #0077EE; }

    </style>
</head>
<body>

    <div class="top-bar">
        <div class="app-title">
            <span class="time-text" id="headerTime">25:00</span>
            <span style="color:#555">•</span>
            <span class="task-name" id="taskNameDisplay">Pomodoro</span>
        </div>
        <div class="settings-container">
            <svg class="svg-icon" id="settingsBtn" viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </div>
    </div>

    <div class="timer-container" id="timerContainer">
        <div class="dial-colors"></div>
        <div class="dial-mask" id="dialMask"></div>
        <div class="dial-overlay" id="dialOverlay"></div>
        <div class="pointer-container" id="pointerContainer">
            <div class="pointer-arm">
                <div class="drag-knob"></div>
            </div>
        </div>
        <div class="center-dot"></div>
    </div>

    <div class="controls">
        <button class="control-btn">
            <svg class="control-icon" width="24" height="24" viewBox="0 0 24 24">
                <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/>
            </svg>
        </button>
        <button class="control-btn play" id="playPauseBtn">
            <svg class="control-icon" id="playIcon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
        <button class="control-btn">
            <svg class="control-icon" width="24" height="24" viewBox="0 0 24 24">
                <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/>
            </svg>
        </button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-box">
            <h3>Sync Timer</h3>
            <input type="text" id="syncIdInput" placeholder="Enter Session ID">
            <div class="modal-actions">
                <button class="modal-btn" id="copyIdBtn">Copy ID</button>
                <button class="modal-btn primary" id="loadIdBtn">Join</button>
                <button class="modal-btn" id="closeModal">Close</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, set, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBGQrPw8ZXeViYKILlHl8YPNvKeyWW2Zxc",
            authDomain: "pomodoro-9ea16.firebaseapp.com",
            databaseURL: "https://pomodoro-9ea16-default-rtdb.firebaseio.com",
            projectId: "pomodoro-9ea16",
            storageBucket: "pomodoro-9ea16.firebasestorage.app",
            messagingSenderId: "637893906536",
            appId: "1:637893906536:web:71c2bcf3c10b15b73dc2ec"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // State
        let timeLeft = 25 * 60;
        let isRunning = false;
        let isDragging = false;
        let timerInterval = null;
        let userId = localStorage.getItem('userId') || 'u_' + Math.random().toString(36).substr(2, 6);
        let sessionId = 's_' + Date.now();

        // --- URL PARAMETERS (INTEGRATED) ---
        const params = new URLSearchParams(window.location.search);
        const taskName = params.get('name') || 'Pomodoro';
        document.getElementById('taskNameDisplay').innerText = taskName;
        document.title = taskName + " Focus";

        // DOM
        const container = document.getElementById('timerContainer');
        const headerTime = document.getElementById('headerTime');
        const playBtn = document.getElementById('playPauseBtn');
        const playIconPath = document.querySelector('#playIcon path');

        // Drawing the Dial
        function drawDial() {
            const overlay = document.getElementById('dialOverlay');
            const radius = 180;

            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = i % 5 === 0 ? 'tick major' : 'tick';
                tick.style.transform = `rotate(-${i * 6}deg)`;
                overlay.appendChild(tick);

                if (i % 5 === 0) {
                    const num = document.createElement('div');
                    num.className = 'number';
                    num.innerText = i === 0 ? "60'" : i;

                    const angleDeg = -90 - (i * 6);
                    const angleRad = angleDeg * (Math.PI / 180);
                    const dist = 150;

                    const x = 50 + (dist/radius * 50) * Math.cos(angleRad);
                    const y = 50 + (dist/radius * 50) * Math.sin(angleRad);

                    num.style.left = x + '%';
                    num.style.top = y + '%';
                    overlay.appendChild(num);
                }
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateVisuals() {
            headerTime.innerText = formatTime(timeLeft);

            const minutes = timeLeft / 60;
            const cwDegrees = (360 - (minutes * 6)) % 360;

            const pointer = document.getElementById('pointerContainer');
            pointer.style.setProperty('--angle', `${cwDegrees}deg`);

            const mask = document.getElementById('dialMask');
            mask.style.background = `conic-gradient(
                var(--bg-color) 0deg,
                var(--bg-color) ${cwDegrees}deg,
                transparent ${cwDegrees}deg,
                transparent 360deg
            )`;
        }

        // Logic
        function getMinutesFromEvent(e) {
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - centerX;
            const y = clientY - centerY;
            let angleDeg = Math.atan2(y, x) * (180 / Math.PI);
            let cwAngle = angleDeg + 90;
            if (cwAngle < 0) cwAngle += 360;
            let minutes = (360 - cwAngle) / 6;
            if (minutes >= 59.5) minutes = 0;
            return Math.max(0, Math.min(60, Math.round(minutes)));
        }

        function handleStart(e) {
            if (isRunning) return;
            isDragging = true;
            let m = getMinutesFromEvent(e);
            if(m === 0) m = 60;
            timeLeft = m * 60;
            updateVisuals();
            sync();
        }

        function handleMove(e) {
            if (!isDragging) return;
            e.preventDefault();
            let m = getMinutesFromEvent(e);
            if(m === 0) m = 60;
            timeLeft = m * 60;
            updateVisuals();
        }

        function handleEnd() {
            if (isDragging) {
                isDragging = false;
                sync();
            }
        }

        container.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        container.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        function toggleTimer() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
                document.body.classList.remove('is-running');
                playIconPath.setAttribute('d', 'M8 5v14l11-7z');
            } else {
                isRunning = true;
                document.body.classList.add('is-running');
                playIconPath.setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');

                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateVisuals();
                        if (timeLeft % 5 === 0) sync();
                    } else {
                        toggleTimer();
                        new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
                    }
                }, 1000);
            }
            sync();
        }

        playBtn.addEventListener('click', toggleTimer);

        // Firebase Sync with Error Logging
        function sync() {
            set(ref(database, 'timers/' + userId), {
                timeLeft,
                isRunning,
                timestamp: Date.now(),
                sessionId
            }).catch(err => {
                console.error("Firebase Sync Failed (Check Rules/Config):", err);
            });
        }

        function initSync() {
            onValue(ref(database, 'timers/' + userId), (snap) => {
                const data = snap.val();
                if (!data || data.sessionId === sessionId) return;
                const now = Date.now();
                const elapsed = Math.floor((now - data.timestamp) / 1000);
                let remoteTime = data.timeLeft;
                if (data.isRunning) {
                    remoteTime = Math.max(0, remoteTime - elapsed);
                    if (!isRunning) toggleTimer();
                } else {
                    if (isRunning) toggleTimer();
                }
                if (Math.abs(timeLeft - remoteTime) > 2) {
                    timeLeft = remoteTime;
                    updateVisuals();
                }
            }, (err) => console.error("Read Error:", err));
        }

        // Modal
        const modal = document.getElementById('settingsModal');
        document.getElementById('settingsBtn').onclick = () => {
            document.getElementById('syncIdInput').value = userId;
            modal.classList.add('active');
        };
        document.getElementById('closeModal').onclick = () => modal.classList.remove('active');
        document.getElementById('loadIdBtn').onclick = () => {
            const id = document.getElementById('syncIdInput').value.trim();
            if(id) {
                userId = id;
                localStorage.setItem('userId', id);
                initSync();
                modal.classList.remove('active');
            }
        };
        document.getElementById('copyIdBtn').onclick = () => {
            navigator.clipboard.writeText(userId);
            alert('ID Copied');
        };

        // Init
        drawDial();
        updateVisuals();
        initSync();

        // --- Auto Start from URL ---
        // Check if we should start immediately after loading
        setTimeout(() => {
            if (params.get('action') === 'start' && !isRunning) {
                toggleTimer();
            }
        }, 500);

    </script>
</body>
</html>
